apiVersion: v1
kind: Namespace
metadata:
  name: controlplane-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controlplane-operator-controller-manager
  namespace: controlplane-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controlplane-operator-manager-role
rules:
  - apiGroups: [""]
    resources: ["pods","services","configmaps","secrets","namespaces"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["apps"]
    resources: ["deployments","statefulsets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers","clusterissuers","certificates","certificaterequests"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["controlplane.patrostkowski.dev"]
    resources: ["managedcontrolplanes"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["controlplane.patrostkowski.dev"]
    resources: ["managedcontrolplanes/status"]
    verbs: ["get","update","patch"]
  - apiGroups: ["controlplane.patrostkowski.dev"]
    resources: ["managedcontrolplanes/finalizers"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controlplane-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controlplane-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: controlplane-operator-controller-manager
    namespace: controlplane-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane-operator-controller-manager
  namespace: controlplane-system
  labels:
    app.kubernetes.io/name: controlplane-operator
    app.kubernetes.io/component: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: controlplane-operator
      app.kubernetes.io/component: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlplane-operator
        app.kubernetes.io/component: controller-manager
    spec:
      serviceAccountName: controlplane-operator-controller-manager
      containers:
        - name: manager
          image: patrostkowski/controlplane-operator:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

# Basic runtime + cgroups
cgroupDriver: systemd
containerRuntimeEndpoint: "unix:///run/crio/crio.sock"
failSwapOn: false

clusterDomain: cluster.local
clusterDNS:
  - 10.96.0.10
resolvConf: "/run/systemd/resolve/resolv.conf"

# API server auth (typical kubeadm-style settings)
authentication:
  anonymous:
    enabled: false
  webhook:
    enabled: true
authorization:
  mode: Webhook

# Node status / heartbeats etc. – sane defaults
readOnlyPort: 0
healthzBindAddress: 127.0.0.1
healthzPort: 10248
port: 10250
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.18.1.240-172.18.1.250
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example
  namespace: metallb-system
---
apiVersion: controlplane.patrostkowski.dev/v1alpha1
kind: ManagedControlPlane
metadata:
  name: my-kubernetes
  namespace: default
spec:
  kubernetes:
    version: "v1.34.0"
    networking:
      serviceCIDR: "10.96.0.0/12"
      podCIDR: "10.244.0.0/16"

version: '3'

tasks:
  docs:
    desc: "Serve controlplane MkDocs from ./docs/"
    cmds:
      - docker run --rm -it -p 8000:8000 -v $(pwd)/docs:/docs squidfunk/mkdocs-material serve -f /docs/mkdocs.yml -a 0.0.0.0:8000

  codegen:
    desc: "Run all code generation scripts (client + CRDs) inside hack/"
    cmds:
      - bash hack/update-codegen.sh
      - bash hack/update-crds.sh
  
  install:
    desc: "Install controlplane CRDs into current kube context"
    cmds:
      - helm upgrade --install cert-manager "oci://quay.io/jetstack/charts/cert-manager"                                       
        --namespace cert-manager
        --create-namespace
        --set crds.enabled=true
      - kubectl apply -f config/crd/

  uninstall-crds:
    desc: "Remove controlplane CRDs from cluster"
    cmds:
      - kubectl delete -f config/crd/ || true

  run:
    desc: "Run the controlplane operator locally (for development)"
    dir: cmd/controlplane-operator
    cmds:
      - go run main.go

  os:builder:
    desc: Build MCPos builder image
    dir: ./os
    cmds:
      - docker build -t mcpos-builder -f Dockerfile .

  os:fetch-binaries:
    desc: Fetch kubelet/containerd/etc into rootfs using mcpos-builder
    deps:
      - os:builder
    cmds:
      - >
        docker run --rm
        -v "$(pwd)/os:/workspace/os"
        mcpos-builder
        bash -lc "cd /workspace/os && ./scripts/fetch-binaries.sh && ./scripts/fetch-glibc.sh"

  os:build-kernel:
    desc: Build MCPos kernel using mcpos-builder
    deps:
      - os:builder
    cmds:
      - >
        docker run --rm
        -v "$(pwd)/os:/workspace/os"
        mcpos-builder
        bash -lc "cd /workspace/os && ./scripts/build-kernel.sh"

  os:build-initramfs:
    desc: Build MCPos initramfs using mcpos-builder
    deps:
      - os:builder
    cmds:
      - >
        docker run --rm
        -v "$(pwd)/os:/workspace/os"
        mcpos-builder
        bash -lc "cd /workspace/os && ./scripts/build-initramfs.sh"

  os:run-qemu:
    desc: "Run MCPos kernel + initramfs in QEMU (inside mcpos-builder)"
    deps:
      - os:builder
      - os:build-kernel
      - os:build-initramfs
    cmds:
      - >
        docker run --rm -it
        -v "$(pwd)/os:/workspace/os"
        mcpos-builder
        bash -lc "cd /workspace/os && ./scripts/run-qemu.sh"

  os:build:
    desc: Build MCPos kernel + rootfs (inside mcpos-builder)
    deps:
      - os:fetch-binaries
      - os:build-kernel
      - os:build-initramfs

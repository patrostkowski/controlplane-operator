syntax = "proto3";

package agent.v1alpha1;

option go_package = "github.com/patrostkowski/controlplane-operator/proto/agent/v1alpha1;v1alpha1";

service AgentService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
}

message JoinRequest {
  bytes KubeletConfig = 1;
  bytes InitKubeconfig = 2;
  bytes CACert = 3;
}

message JoinResponse {
  StatusCode code = 1;
  string message = 2;
}

message StatusRequest {}

message StatusResponse {
  StatusCode code = 1;
  string message = 2;
  int64 timestamp = 3;

  ComponentStatus kubelet = 4;
  ComponentStatus containerd = 5;
}

enum StatusCode {
  STATUS_CODE_UNSPECIFIED = 0;
  STATUS_CODE_OK = 1;
  STATUS_CODE_NOK = 2;
}

message ComponentStatus {
  bool healthy = 1;
  string message = 2;
  string version = 3;
}



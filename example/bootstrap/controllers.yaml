# 04-controllers.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: controller-kubeconfig
  namespace: managed-k8s
data:
  controller-manager.conf: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: local
      cluster:
        server: https://kube-apiserver.managed-k8s.svc:443
        certificate-authority: /var/run/k8s/ca/ca.crt      # << file path (mounted)
    contexts:
    - name: local
      context:
        cluster: local
        user: cm
    current-context: local
    users:
    - name: cm
      user:
        client-certificate: /var/run/k8s/cm/tls.crt        # from cm-client
        client-key: /var/run/k8s/cm/tls.key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-kubeconfig
  namespace: managed-k8s
data:
  scheduler.conf: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: local
      cluster:
        server: https://kube-apiserver.managed-k8s.svc:443
        certificate-authority: /var/run/k8s/ca/ca.crt      # << file path (mounted)
    contexts:
    - name: local
      context:
        cluster: local
        user: scheduler
    current-context: local
    users:
    - name: scheduler
      user:
        client-certificate: /var/run/k8s/scheduler/tls.crt # from scheduler-client
        client-key: /var/run/k8s/scheduler/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-controller-manager
  namespace: managed-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kcm
  template:
    metadata:
      labels:
        app: kcm
    spec:
      containers:
      - name: kcm
        image: registry.k8s.io/kube-controller-manager:v1.31.3
        imagePullPolicy: IfNotPresent
        command:
        - kube-controller-manager
        - --bind-address=0.0.0.0
        - --cluster-name=managed
        - --kubeconfig=/etc/kubernetes/controller-manager.conf
        - --authentication-kubeconfig=/etc/kubernetes/controller-manager.conf
        - --authorization-kubeconfig=/etc/kubernetes/controller-manager.conf
        - --leader-elect=true
        - --use-service-account-credentials=true
        - --controllers=*,bootstrapsigner,tokencleaner
        - --allocate-node-cidrs=false
        # service account tokens (private key)
        - --service-account-private-key-file=/var/run/k8s/sa/tls.key
        - --cluster-signing-cert-file=/var/run/k8s/ca/tls.crt
        - --cluster-signing-key-file=/var/run/k8s/ca/tls.key
        - --client-ca-file=/var/run/k8s/ca/tls.crt
        - --root-ca-file=/var/run/k8s/ca/tls.crt
        volumeMounts:
          - name: kcfg
            mountPath: /etc/kubernetes
            readOnly: true
          - name: cmcert
            mountPath: /var/run/k8s/cm
            readOnly: true
          - name: sa-signer
            mountPath: /var/run/k8s/sa
            readOnly: true
          - name: kubernetes-ca
            mountPath: /var/run/k8s/ca
            readOnly: true
      volumes:
        - name: kcfg
          configMap:
            name: controller-kubeconfig
            items:
            - key: controller-manager.conf
              path: controller-manager.conf
        - name: cmcert
          secret:
            secretName: cm-client            # from your Certificate
        - name: sa-signer
          secret:
            secretName: sa-signer            # tls.key used by kcm
        - name: kubernetes-ca
          secret:
            secretName: managed-ca           # provides ca.crt and ca.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-scheduler
  namespace: managed-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ks
  template:
    metadata:
      labels:
        app: ks
    spec:
      containers:
      - name: ks
        image: registry.k8s.io/kube-scheduler:v1.31.3
        imagePullPolicy: IfNotPresent
        command:
        - kube-scheduler
        - --bind-address=0.0.0.0
        - --kubeconfig=/etc/kubernetes/scheduler.conf
        - --authentication-kubeconfig=/etc/kubernetes/scheduler.conf
        - --authorization-kubeconfig=/etc/kubernetes/scheduler.conf
        - --leader-elect=true
        volumeMounts:
          - name: kcfg
            mountPath: /etc/kubernetes
            readOnly: true
          - name: schcert
            mountPath: /var/run/k8s/scheduler
            readOnly: true
          - name: kubernetes-ca
            mountPath: /var/run/k8s/ca
            readOnly: true
      volumes:
        - name: kcfg
          configMap:
            name: scheduler-kubeconfig
            items:
            - key: scheduler.conf
              path: scheduler.conf
        - name: schcert
          secret:
            secretName: scheduler-client     # from your Certificate
        - name: kubernetes-ca
          secret:
            secretName: managed-ca

# 03-apiserver.yaml
apiVersion: v1
kind: Service
metadata:
  name: kube-apiserver
  namespace: managed-k8s
spec:
  selector:
    app: kube-apiserver
  ports:
    - name: https
      port: 443
      targetPort: 6443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-apiserver
  namespace: managed-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-apiserver
  template:
    metadata:
      labels:
        app: kube-apiserver
    spec:
      containers:
      - name: apiserver
        image: registry.k8s.io/kube-apiserver:v1.31.3
        imagePullPolicy: IfNotPresent
        command:
        - kube-apiserver
        - --advertise-address=0.0.0.0
        - --bind-address=0.0.0.0
        - --secure-port=6443
        - --service-cluster-ip-range=10.200.0.0/16

        # etcd configuration (mTLS)
        - --etcd-servers=https://etcd-0.etcd.managed-k8s.svc:2379
        - --etcd-cafile=/var/run/k8s/etcd-ca/ca.crt
        - --etcd-certfile=/var/run/k8s/etcd-client/tls.crt
        - --etcd-keyfile=/var/run/k8s/etcd-client/tls.key

        # apiserver PKI
        - --client-ca-file=/var/run/k8s/ca/tls.crt
        - --tls-cert-file=/var/run/k8s/apiserver/tls.crt
        - --tls-private-key-file=/var/run/k8s/apiserver/tls.key

        # kubelet client certs
        - --kubelet-client-certificate=/var/run/k8s/kubelet-client/tls.crt
        - --kubelet-client-key=/var/run/k8s/kubelet-client/tls.key
        - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalIP,ExternalDNS

        # authn/z
        - --authorization-mode=Node,RBAC
        - --enable-bootstrap-token-auth=true

        # service account keys
        - --service-account-issuer=https://kubernetes.default.svc.cluster.local
        - --service-account-key-file=/var/run/k8s/sa/tls.crt
        - --service-account-signing-key-file=/var/run/k8s/sa/tls.key

        - --allow-privileged=true

        - --requestheader-client-ca-file=/var/run/k8s/front-proxy-ca/tls.crt
        - --requestheader-allowed-names=front-proxy-client
        - --requestheader-extra-headers-prefix=X-Remote-Extra-
        - --requestheader-group-headers=X-Remote-Group
        - --requestheader-username-headers=X-Remote-User
        - --proxy-client-cert-file=/var/run/k8s/front-proxy-client/tls.crt
        - --proxy-client-key-file=/var/run/k8s/front-proxy-client/tls.key

        ports:
          - name: https
            containerPort: 6443

        livenessProbe:
          httpGet:
            scheme: HTTPS
            host: 127.0.0.1
            port: 6443
            path: /livez
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            scheme: HTTPS
            host: 127.0.0.1
            port: 6443
            path: /readyz
          initialDelaySeconds: 5
          periodSeconds: 5

        volumeMounts:
          - name: ca
            mountPath: /var/run/k8s/ca
            readOnly: true
          - name: apiserver-tls
            mountPath: /var/run/k8s/apiserver
            readOnly: true
          - name: etcd-ca
            mountPath: /var/run/k8s/etcd-ca
            readOnly: true
          - name: etcd-client
            mountPath: /var/run/k8s/etcd-client
            readOnly: true
          - name: kubelet-client
            mountPath: /var/run/k8s/kubelet-client
            readOnly: true
          - name: sa-signer
            mountPath: /var/run/k8s/sa
            readOnly: true
          - { name: front-proxy-ca,     mountPath: /var/run/k8s/front-proxy-ca,     readOnly: true }
          - { name: front-proxy-client, mountPath: /var/run/k8s/front-proxy-client, readOnly: true }

      volumes:
        - name: ca
          secret:
            secretName: managed-ca
        - name: apiserver-tls
          secret:
            secretName: apiserver-tls
        - name: etcd-ca
          secret:
            secretName: etcd-ca
        - name: etcd-client
          secret:
            secretName: apiserver-etcd-client
        - name: kubelet-client
          secret:
            secretName: apiserver-kubelet-client
        - name: sa-signer
          secret:
            secretName: sa-signer
        - name: front-proxy-ca
          secret: { secretName: front-proxy-ca }
        - name: front-proxy-client
          secret: { secretName: front-proxy-client }

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.18.0.250-172.18.0.255
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example
  namespace: metallb-system
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: ManagedControlPlaneTemplate
metadata:
  name: example-mcp-template
  namespace: mcp
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: controlplane-operator
    spec:
      replicas: 3
      version: "v1.34.1"
      providerSpec:
        kubernetes:
          version: "v1.34.1"
          networking:
            serviceCIDR: "10.96.0.0/12"
            podCIDR: "10.244.0.0/16"
---
apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
kind: ManagedControlPlane
metadata:
  name: example-capi
  namespace: mcp
spec:
  clusterName: example-cluster
  replicas: 1
  version: "v1.34.1"
  templateRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1alpha1
    kind: ManagedControlPlaneTemplate
    name: example-mcp-template
    namespace: mcp


apiVersion: controlplane.patrostkowski.dev/v1alpha1
kind: ManagedControlPlane
metadata:
  name: example-mcp
  namespace: mcp
spec:
  version: "v1.34.0"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: admin-client
  namespace: mcp
spec:
  secretName: admin-client
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: ca-issuer
    kind: Issuer
  commonName: kubernetes-admin
  subject:
    organizations:
      - system:masters
  usages:
    - digital signature
    - key encipherment
    - client auth
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-kubeconfig
  namespace: mcp
data:
  config: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: managed
      cluster:
        server: https://kube-apiserver.mcp.svc:443
        certificate-authority: /var/run/k8s/ca/ca.crt
    contexts:
    - name: managed
      context:
        cluster: managed
        user: admin
    current-context: managed
    users:
    - name: admin
      user:
        client-certificate: /var/run/k8s/admin/tls.crt
        client-key: /var/run/k8s/admin/tls.key
---
apiVersion: v1
kind: Pod
metadata:
  name: admin-kubectl
  namespace: mcp
spec:
  restartPolicy: Never
  containers:
  - name: kubectl
    image: bitnami/kubectl:latest
    command: ["sleep", "infinity"]
    env:
      - name: KUBECONFIG
        value: /etc/kube/config
    volumeMounts:
      - name: admin-kubeconfig
        mountPath: /etc/kube
        readOnly: true
      - name: admin-client
        mountPath: /var/run/k8s/admin
        readOnly: true
      - name: ca
        mountPath: /var/run/k8s/ca
        readOnly: true
  volumes:
    - name: admin-kubeconfig
      configMap:
        name: admin-kubeconfig
        items:
        - key: config
          path: config
    - name: admin-client
      secret:
        secretName: admin-client
    - name: ca
      secret:
        secretName: managed-ca

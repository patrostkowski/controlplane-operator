---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.30.0.250-172.30.0.255
  autoAssign: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: example
  namespace: metallb-system
---
apiVersion: controlplane.patrostkowski.dev/v1alpha1
kind: ManagedControlPlane
metadata:
  name: example-mcp
  namespace: mcp
spec:
  version: "v1.34.1"
  networking:
    serviceCIDR: "10.96.0.0/12"
    podCIDR: "10.244.0.0/16"
---
apiVersion: controlplane.patrostkowski.dev/v1alpha1
kind: MachineConfigruation
metadata:
  name: example-mcp
  namespace: mcp
spec:
  kubeletConfiguration: 
  initKubeconfig: 
  joinTokenSecretRef:
    secretName: "bootstrap-token-ywycpa"
  caCertSecretRef:
    name: "managed-ca"
